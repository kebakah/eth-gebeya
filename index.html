<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ETH Online Gebeya</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.1/firebase-firestore-compat.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F0;
    --ink:#1F2A24;
    --ink-soft:#54615A;
    --gold:#E8A93B;
    --gold-dark:#C98C22;
    --teal:#1B6B5A;
    --teal-soft:#E4F1EC;
    --red:#C1523D;
    --red-soft:#F7E7E2;
    --amber-soft:#FBF0DA;
    --line:#E4DCCB;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:78px;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; position:relative; }

  /* ---- header ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 14px;
  }
  .brand{ display:flex; flex-direction:column; }
  .brand .name{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .brand .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .demo-pill{
    font-size:11px; background:var(--amber-soft); color:var(--gold-dark);
    padding:4px 10px; border-radius:20px; border:1px solid var(--gold);
    cursor:pointer;
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .user-chip{
    font-size:12.5px; font-weight:600; color:var(--ink);
    background:var(--teal-soft); padding:6px 12px; border-radius:20px;
    white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---- product grid ---- */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:4px 18px 18px; }
  .p-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; cursor:pointer; transition:transform .12s ease;
  }
  .p-card:active{ transform:scale(0.97); }
  .p-card img{ width:100%; height:130px; object-fit:cover; display:block; background:var(--amber-soft); }
  .p-card .info{ padding:10px 12px 12px; }
  .p-card .pname{ font-size:14px; font-weight:600; line-height:1.25; margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .p-card .pprice{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--teal); }
  .empty{ text-align:center; color:var(--ink-soft); padding:60px 30px; font-size:14.5px; }
  .empty .serif{ font-size:19px; color:var(--ink); display:block; margin-bottom:6px; }

  /* ---- product detail ---- */
  .detail-hero img{ width:100%; height:280px; object-fit:cover; background:var(--amber-soft); }
  .detail-body{ padding:20px 18px 100px; }
  .detail-body .pname{ font-family:'Fraunces',serif; font-size:23px; font-weight:600; margin:0 0 8px; }
  .detail-body .pprice{ font-family:'Fraunces',serif; font-size:20px; color:var(--teal); font-weight:600; margin-bottom:14px; }
  .detail-body .pdesc{ font-size:14.5px; line-height:1.6; color:var(--ink-soft); margin-bottom:20px; }
  .qty-row{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .qty-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:18px; cursor:pointer; }
  .qty-val{ font-weight:600; min-width:20px; text-align:center; }

  /* ---- back / bar buttons ---- */
  .back-btn{ padding:16px 18px 0; }
  .back-btn button{ background:none; border:none; font-size:14px; color:var(--ink-soft); cursor:pointer; padding:0; }

  /* ---- bottom fixed bar ---- */
  .fixed-bar{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    background:var(--cream); border-top:1px solid var(--line); padding:12px 18px 16px;
    display:flex; gap:10px;
  }
  .btn-primary{
    flex:1; background:var(--gold); color:var(--ink); border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:600; cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .btn-primary:active{ background:var(--gold-dark); }
  .btn-secondary{
    flex:1; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:12px;
    padding:14px; font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn-outline-teal{ background:#fff; border:1px solid var(--teal); color:var(--teal); }
  .btn-danger{ background:#fff; border:1px solid var(--red); color:var(--red); }
  button:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---- bottom tab nav ---- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    background:#fff; border-top:1px solid var(--line); display:flex;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 4px 8px; cursor:pointer; color:var(--ink-soft); font-size:11px; position:relative;
  }
  .tab.active{ color:var(--teal); }
  .tab svg{ width:20px; height:20px; }
  .tab .badge{
    position:absolute; top:4px; right:22%; background:var(--red); color:#fff; font-size:10px;
    min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  /* ---- cart ---- */
  .cart-item{ display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .cart-item img{ width:60px; height:60px; border-radius:10px; object-fit:cover; background:var(--amber-soft); }
  .cart-item .ci-info{ flex:1; }
  .cart-item .ci-name{ font-weight:600; font-size:14px; margin-bottom:4px; }
  .cart-item .ci-price{ color:var(--teal); font-weight:600; font-size:13.5px; }
  .cart-item .ci-remove{ background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0; margin-top:6px; }
  .cart-total-row{ display:flex; justify-content:space-between; padding:16px 18px; font-weight:600; font-size:16px; }
  .cart-total-row .amt{ font-family:'Fraunces',serif; color:var(--teal); }

  /* ---- payment ---- */
  .pay-wrap{ padding:22px 18px 110px; }
  .pay-summary{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px; }
  .pay-summary .row{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--ink-soft); }
  .pay-summary .row.total{ color:var(--ink); font-weight:700; font-size:15px; border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }
  .telebirr-card{
    background:var(--teal); color:#fff; border-radius:16px; padding:20px; margin-bottom:16px;
  }
  .telebirr-card .tb-label{ font-size:12.5px; opacity:.85; margin-bottom:10px; }
  .telebirr-number-row{ display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.12); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .telebirr-number{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; letter-spacing:0.02em; }
  .copy-btn{ background:#fff; color:var(--teal); border:none; border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .tb-steps{ font-size:13px; line-height:1.7; opacity:.95; margin:0; padding-left:18px; }
  .ref-note{ font-size:13px; background:rgba(255,255,255,.12); border-radius:8px; padding:10px 12px; margin-top:12px; }

  /* ---- upload ---- */
  .upload-wrap{ padding:22px 18px 110px; }
  .drop-zone{
    border:1.5px dashed var(--line); border-radius:14px; background:var(--card);
    padding:30px 16px; text-align:center; cursor:pointer; margin-bottom:16px;
  }
  .drop-zone.has-file{ border-color:var(--teal); }
  .drop-zone svg{ margin-bottom:8px; }
  .drop-zone .dz-text{ font-size:13.5px; color:var(--ink-soft); }
  .receipt-preview{ width:100%; max-height:260px; object-fit:contain; border-radius:12px; margin-bottom:14px; background:#f4f4f4; }
  textarea{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-family:'Work Sans',sans-serif;
    font-size:14px; resize:vertical; min-height:70px; background:#fff;
  }

  /* ---- status / orders ---- */
  .order-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin:0 18px 14px; padding:16px; cursor:pointer; }
  .order-card .oc-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .order-card .oc-id{ font-size:12.5px; color:var(--ink-soft); }
  .order-card .oc-total{ font-family:'Fraunces',serif; font-weight:600; color:var(--teal); font-size:15px; margin-top:2px; }
  .status-badge{ font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .status-pending_payment{ background:var(--amber-soft); color:var(--gold-dark); }
  .status-submitted{ background:var(--amber-soft); color:var(--gold-dark); }
  .status-confirmed{ background:var(--teal-soft); color:var(--teal); }
  .status-rejected{ background:var(--red-soft); color:var(--red); }
  .oc-items{ font-size:13px; color:var(--ink-soft); }
  .conf-hero{ text-align:center; padding:50px 30px 20px; }
  .conf-hero .serif{ font-size:21px; margin:14px 0 8px; }
  .conf-hero p{ color:var(--ink-soft); font-size:14px; line-height:1.6; }

  /* ---- admin ---- */
  .section-title{ padding:18px 18px 6px; font-family:'Fraunces',serif; font-size:18px; font-weight:600; }
  .admin-row{ display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); align-items:center; }
  .admin-row img{ width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--amber-soft); }
  .admin-row .ar-name{ font-weight:600; font-size:14px; }
  .admin-row .ar-price{ color:var(--teal); font-size:13px; font-weight:600; }
  .icon-btn{ background:none; border:1px solid var(--line); border-radius:8px; width:34px; height:34px; cursor:pointer; font-size:14px; }
  .add-fab{
    position:fixed; bottom:90px; right:calc(50% - 260px + 18px); background:var(--ink); color:#fff;
    border:none; border-radius:14px; padding:13px 18px; font-size:14px; font-weight:600; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .admin-subnav{ display:flex; gap:8px; padding:0 18px 12px; }
  .admin-subnav button{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:13px;
    font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .admin-subnav button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  @media (max-width:520px){ .add-fab{ right:18px; } }
  .form-wrap{ padding:18px 18px 110px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .field input[type=text], .field input[type=number]{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14px; font-family:'Work Sans',sans-serif;
  }
  .img-picker{ display:flex; gap:10px; align-items:center; }
  .img-picker img{ width:64px; height:64px; border-radius:10px; object-fit:cover; background:var(--amber-soft); }
  .file-btn{ border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; font-size:13px; cursor:pointer; }
  .order-detail-receipt{ width:100%; border-radius:12px; margin:14px 0; }
  .kv{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; color:var(--ink-soft); }
  .kv b{ color:var(--ink); }
  .note-box{ background:var(--amber-soft); border-radius:10px; padding:12px 14px; font-size:13.5px; margin:12px 0; }
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:10px; font-size:13px; z-index:999; opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
// Add your own Telegram @usernames here (no @). Anyone in this list sees the Admin tab.
const ADMIN_USERNAMES = ['kibromk']; // auto-admin when this Telegram @username opens the app
const TELEBIRR_NUMBER = '930533061';

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCAjISTEbYbPfbx-xCacA6aLGO5xBqpa58",
  authDomain: "eth-online-gebeya.firebaseapp.com",
  projectId: "eth-online-gebeya",
  storageBucket: "eth-online-gebeya.firebasestorage.app",
  messagingSenderId: "942316634673",
  appId: "1:942316634673:web:008804f66a36436a07cb10"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============ TELEGRAM INIT ============ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

/* ============ STATE ============ */
const state = {
  screen: 'catalog',
  products: [],
  orders: [],
  cart: [],           // {productId, qty}
  demoRole: null,     // 'customer' | 'admin' (only used when not inside Telegram)
  viewingProductId: null,
  viewingOrderId: null,
  currentOrderId: null,
  editingProductId: null,
  pendingImageData: null,
  loaded: false,
};

function getUser(){
  if (tgUser) return { id: String(tgUser.id), username: tgUser.username || '', name: tgUser.first_name || 'Customer' };
  return { id: 'demo-user', username: 'demo_user', name: 'Demo Customer' };
}
function isAdmin(){
  if (tgUser && tgUser.username) return ADMIN_USERNAMES.includes(tgUser.username);
  return state.demoRole === 'admin';
}

/* ============ STORAGE (Firestore, live sync) ============ */
let _productsReady = false, _ordersReady = false;
function _maybeFinishLoading(){
  if (_productsReady && _ordersReady && !state.loaded){ state.loaded = true; render(); }
}
function setupRealtimeSync(){
  db.collection('products').orderBy('createdAt','asc').onSnapshot(snap=>{
    state.products = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    _productsReady = true;
    if (state.loaded) render(); else _maybeFinishLoading();
  }, err=>{ console.error(err); showToast('Could not load products'); });

  db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.orders = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    _ordersReady = true;
    if (state.loaded) render(); else _maybeFinishLoading();
  }, err=>{ console.error(err); showToast('Could not load orders'); });
}
async function fsSaveProduct(p){
  try { await db.collection('products').doc(p.id).set(p); }
  catch(e){ console.error(e); showToast('Could not save product'); }
}
async function fsDeleteProduct(id){
  try { await db.collection('products').doc(id).delete(); }
  catch(e){ console.error(e); showToast('Could not delete product'); }
}
async function fsSaveOrder(o){
  try { await db.collection('orders').doc(o.id).set(o); }
  catch(e){ console.error(e); showToast('Could not save order'); }
}
async function upsertUserProfile(){
  if (!tgUser) return;
  const ref = db.collection('users').doc(String(tgUser.id));
  try {
    const snap = await ref.get();
    const data = {
      id: String(tgUser.id),
      username: tgUser.username || '',
      firstName: tgUser.first_name || '',
      lastName: tgUser.last_name || '',
      lastSeen: Date.now(),
    };
    if (!snap.exists) data.firstSeen = Date.now();
    await ref.set(data, { merge: true });
  } catch(e){ console.error(e); }
}

/* ============ HELPERS ============ */
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function go(screen){ state.screen = screen; render(); window.scrollTo(0,0); }
function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }
function cartTotal(){
  return state.cart.reduce((s,c)=>{
    const p = state.products.find(pr=>pr.id===c.productId);
    return s + (p ? p.price*c.qty : 0);
  },0);
}
function productImg(p){ return p.image || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="%23FBF0DA"/></svg>'; }

function resizeImageFile(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ ICONS ============ */
const ICONS = {
  shop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9l1-5h14l1 5M4 9h16M4 9v10a1 1 0 001 1h14a1 1 0 001-1V9M9 21v-6h6v6"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h2l2.4 12.2a2 2 0 002 1.6h8.7a2 2 0 002-1.6L21 7H6"/></svg>',
  orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10v18l-5-3-5 3V3z"/></svg>',
  admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>',
};

/* ============ RENDER: TOP BAR ============ */
function renderTopbar(){
  const demoBadge = !tgUser ? `<div class="demo-pill" onclick="toggleDemoRole()">Preview: ${isAdmin() ? 'Admin' : 'Customer'} (tap to switch)</div>` : '';
  const adminBtn = isAdmin() ? `<button class="icon-btn" style="width:36px;height:36px;" onclick="go('admin-products')" title="Admin">${ICONS.admin}</button>` : '';
  const user = getUser();
  const userChip = `<div class="user-chip">${escapeHtml(user.name)}</div>`;
  return `
  <div class="topbar">
    <div class="brand">
      <div class="name">ETH Online Gebeya</div>
      <div class="sub">Small goods, delivered</div>
    </div>
    <div class="topbar-right">
      ${userChip}
      ${demoBadge}
      ${adminBtn}
    </div>
  </div>`;
}
function toggleDemoRole(){
  state.demoRole = isAdmin() ? 'customer' : 'admin';
  render();
}

/* ============ RENDER: TAB BAR ============ */
function renderTabbar(active){
  const tabs = [
    {id:'catalog', label:'Shop', icon:ICONS.shop},
    {id:'cart', label:'Cart', icon:ICONS.cart, badge: cartCount()},
    {id:'myorders', label:'Orders', icon:ICONS.orders},
  ];
  return `<div class="tabbar">${tabs.map(t=>`
    <div class="tab ${active===t.id?'active':''}" onclick="go('${t.id}')">
      ${t.icon}
      <span>${t.label}</span>
      ${t.badge ? `<span class="badge">${t.badge}</span>` : ''}
    </div>`).join('')}</div>`;
}

/* ============ SCREEN: CATALOG ============ */
function renderCatalog(){
  const items = state.products;
  return `
  ${renderTopbar()}
  ${items.length===0 ? `<div class="empty"><span class="serif">Nothing on the shelf yet</span>${isAdmin() ? 'Head to the Admin tab to add your first product.' : 'Check back soon.'}</div>` : `
  <div class="grid">
    ${items.map(p=>`
      <div class="p-card" onclick="viewProduct('${p.id}')">
        <img src="${productImg(p)}" alt="">
        <div class="info">
          <div class="pname">${escapeHtml(p.name)}</div>
          <div class="pprice">${fmt(p.price)} ETB</div>
        </div>
      </div>`).join('')}
  </div>`}
  ${renderTabbar('catalog')}`;
}

/* ============ SCREEN: PRODUCT DETAIL ============ */
function renderProduct(){
  const p = state.products.find(x=>x.id===state.viewingProductId);
  if (!p){ go('catalog'); return ''; }
  if (!state._qty) state._qty = 1;
  return `
  <div class="back-btn"><button onclick="go('catalog')">&larr; Back to shop</button></div>
  <div class="detail-hero"><img src="${productImg(p)}" alt=""></div>
  <div class="detail-body">
    <div class="pname">${escapeHtml(p.name)}</div>
    <div class="pprice">${fmt(p.price)} ETB</div>
    <div class="pdesc">${escapeHtml(p.description||'')}</div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">&minus;</button>
      <div class="qty-val" id="qtyVal">${state._qty}</div>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
  </div>
  <div class="fixed-bar">
    <button class="btn-secondary" onclick="addToCart('${p.id}')">Add to cart</button>
    <button class="btn-primary" onclick="buyNow('${p.id}')">Buy now</button>
  </div>`;
}
function changeQty(d){
  state._qty = Math.max(1, (state._qty||1)+d);
  const el = document.getElementById('qtyVal');
  if (el) el.textContent = state._qty;
}
function viewProduct(id){ state.viewingProductId = id; state._qty = 1; go('product'); }
function addToCart(id){
  const existing = state.cart.find(c=>c.productId===id);
  if (existing) existing.qty += state._qty||1;
  else state.cart.push({productId:id, qty: state._qty||1});
  showToast('Added to cart');
  render();
}
function buyNow(id){
  addToCart(id);
  go('cart');
}

/* ============ SCREEN: CART ============ */
function renderCart(){
  if (state.cart.length===0){
    return `
    <div class="topbar"><div class="brand"><div class="name">Your cart</div></div></div>
    <div class="empty"><span class="serif">Your cart is empty</span>Browse the shop to add something you like.</div>
    ${renderTabbar('cart')}`;
  }
  return `
  <div class="topbar"><div class="brand"><div class="name">Your cart</div></div></div>
  ${state.cart.map(c=>{
    const p = state.products.find(pr=>pr.id===c.productId);
    if (!p) return '';
    return `
    <div class="cart-item">
      <img src="${productImg(p)}" alt="">
      <div class="ci-info">
        <div class="ci-name">${escapeHtml(p.name)}</div>
        <div class="ci-price">${fmt(p.price)} ETB &times; ${c.qty}</div>
        <button class="ci-remove" onclick="removeFromCart('${c.productId}')">Remove</button>
      </div>
    </div>`;
  }).join('')}
  <div class="cart-total-row"><span>Total</span><span class="amt">${fmt(cartTotal())} ETB</span></div>
  <div class="fixed-bar">
    <button class="btn-primary" onclick="startCheckout()">Checkout</button>
  </div>`;
}
function removeFromCart(id){
  state.cart = state.cart.filter(c=>c.productId!==id);
  render();
}

/* ============ CHECKOUT / PAYMENT ============ */
function startCheckout(){
  const user = getUser();
  const order = {
    id: uid().toUpperCase(),
    userId: user.id,
    username: user.username,
    userName: user.name,
    items: state.cart.map(c=>{
      const p = state.products.find(pr=>pr.id===c.productId);
      return { productId:c.productId, name:p?p.name:'Item', price:p?p.price:0, qty:c.qty };
    }),
    total: cartTotal(),
    status: 'pending_payment',
    receipt: null,
    note: '',
    createdAt: Date.now(),
  };
  state.orders.push(order);
  state.currentOrderId = order.id;
  fsSaveOrder(order);
  state.cart = [];
  go('pay');
}
function renderPay(){
  const order = state.orders.find(o=>o.id===state.currentOrderId);
  if (!order){ go('catalog'); return ''; }
  return `
  <div class="back-btn"><button onclick="go('myorders')">&larr; My orders</button></div>
  <div class="pay-wrap">
    <h2 class="serif" style="margin:10px 0 16px;">Complete your payment</h2>
    <div class="pay-summary">
      ${order.items.map(i=>`<div class="row"><span>${escapeHtml(i.name)} &times; ${i.qty}</span><span>${fmt(i.price*i.qty)} ETB</span></div>`).join('')}
      <div class="row total"><span>Total</span><span>${fmt(order.total)} ETB</span></div>
    </div>
    <div class="telebirr-card">
      <div class="tb-label">Pay with telebirr</div>
      <div class="telebirr-number-row">
        <span class="telebirr-number">${TELEBIRR_NUMBER}</span>
        <button class="copy-btn" onclick="copyNumber()">Copy</button>
      </div>
      <ol class="tb-steps">
        <li>Open the telebirr app or dial the USSD code</li>
        <li>Send <strong>${fmt(order.total)} ETB</strong> to ${TELEBIRR_NUMBER}</li>
        <li>Keep the confirmation screen or SMS &mdash; you'll upload it next</li>
      </ol>
      <div class="ref-note">Reference: order #${order.id}</div>
    </div>
  </div>
  <div class="fixed-bar">
    <button class="btn-primary" onclick="go('upload')">I've paid</button>
  </div>`;
}
function copyNumber(){
  if (navigator.clipboard) navigator.clipboard.writeText(TELEBIRR_NUMBER).then(()=>showToast('Number copied'));
  else showToast(TELEBIRR_NUMBER);
}

/* ============ UPLOAD RECEIPT ============ */
function renderUpload(){
  const order = state.orders.find(o=>o.id===state.currentOrderId);
  if (!order){ go('catalog'); return ''; }
  const hasImg = !!state.pendingImageData;
  return `
  <div class="back-btn"><button onclick="go('pay')">&larr; Back</button></div>
  <div class="upload-wrap">
    <h2 class="serif" style="margin:10px 0 6px;">Upload your receipt</h2>
    <p style="color:var(--ink-soft); font-size:13.5px; margin:0 0 18px;">Add a screenshot or photo of your telebirr confirmation so we can verify your payment.</p>
    ${hasImg ? `<img class="receipt-preview" src="${state.pendingImageData}">` : ''}
    <div class="drop-zone ${hasImg?'has-file':''}" onclick="document.getElementById('receiptFile').click()">
      ${ICONS.upload}
      <div class="dz-text">${hasImg ? 'Tap to choose a different image' : 'Tap to choose an image'}</div>
    </div>
    <input type="file" id="receiptFile" accept="image/*" style="display:none" onchange="onReceiptChosen(event)">
    <textarea id="orderNote" placeholder="Anything the seller should know? (optional)"></textarea>
  </div>
  <div class="fixed-bar">
    <button class="btn-primary" ${hasImg?'':'disabled'} onclick="submitReceipt()">Submit receipt</button>
  </div>`;
}
function onReceiptChosen(e){
  const file = e.target.files[0];
  if (!file) return;
  resizeImageFile(file, 900, (dataUrl)=>{
    state.pendingImageData = dataUrl;
    render();
  });
}
function submitReceipt(){
  const order = state.orders.find(o=>o.id===state.currentOrderId);
  if (!order || !state.pendingImageData) return;
  order.receipt = state.pendingImageData;
  order.note = (document.getElementById('orderNote')||{}).value || '';
  order.status = 'submitted';
  order.submittedAt = Date.now();
  fsSaveOrder(order);
  state.pendingImageData = null;
  go('status');
}

/* ============ STATUS / CONFIRMATION ============ */
function renderStatus(){
  const order = state.orders.find(o=>o.id===state.currentOrderId);
  if (!order){ go('catalog'); return ''; }
  return `
  <div class="conf-hero">
    <div class="serif">Receipt submitted</div>
    <p>We're reviewing your payment for order <strong>#${order.id}</strong>. You'll see it move to "Confirmed" once the seller checks it &mdash; check the Orders tab any time.</p>
  </div>
  <div class="fixed-bar">
    <button class="btn-primary" onclick="go('catalog')">Back to shop</button>
  </div>`;
}

/* ============ MY ORDERS ============ */
function renderMyOrders(){
  const user = getUser();
  const mine = state.orders.filter(o=>o.userId===user.id).sort((a,b)=>b.createdAt-a.createdAt);
  return `
  <div class="topbar"><div class="brand"><div class="name">My orders</div></div></div>
  ${mine.length===0 ? `<div class="empty"><span class="serif">No orders yet</span>Your past orders and their status will show up here.</div>` :
  mine.map(o=>`
    <div class="order-card" onclick="resumeOrder('${o.id}')">
      <div class="oc-top">
        <div>
          <div class="oc-id">#${o.id}</div>
          <div class="oc-total">${fmt(o.total)} ETB</div>
        </div>
        <span class="status-badge status-${o.status}">${statusLabel(o.status)}</span>
      </div>
      <div class="oc-items">${o.items.map(i=>i.name+' ×'+i.qty).join(', ')}</div>
    </div>`).join('')}
  ${renderTabbar('myorders')}`;
}
function statusLabel(s){
  return { pending_payment:'Awaiting payment', submitted:'Reviewing', confirmed:'Confirmed', rejected:'Not verified' }[s] || s;
}
function resumeOrder(id){
  const o = state.orders.find(x=>x.id===id);
  if (!o) return;
  state.currentOrderId = id;
  if (o.status==='pending_payment') go('pay');
  else if (o.status==='submitted' || o.status==='confirmed' || o.status==='rejected') go('order-view');
}
function renderOrderView(){
  const o = state.orders.find(x=>x.id===state.currentOrderId);
  if (!o){ go('myorders'); return ''; }
  return `
  <div class="back-btn"><button onclick="go('myorders')">&larr; My orders</button></div>
  <div class="pay-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0 16px;">
      <h2 class="serif" style="margin:0;">Order #${o.id}</h2>
      <span class="status-badge status-${o.status}">${statusLabel(o.status)}</span>
    </div>
    <div class="pay-summary">
      ${o.items.map(i=>`<div class="row"><span>${escapeHtml(i.name)} &times; ${i.qty}</span><span>${fmt(i.price*i.qty)} ETB</span></div>`).join('')}
      <div class="row total"><span>Total</span><span>${fmt(o.total)} ETB</span></div>
    </div>
    ${o.receipt ? `<img class="order-detail-receipt" src="${o.receipt}">` : ''}
    ${o.status==='rejected' ? `<div class="note-box">This payment couldn't be verified. Please contact the seller or try submitting your receipt again.</div>` : ''}
  </div>`;
}

/* ============ ADMIN: PRODUCTS ============ */
function renderAdminProducts(){
  return `
  <div class="section-title">Admin</div>
  <div class="admin-subnav">
    <button class="active">Products</button>
    <button onclick="go('admin-orders')">Orders${state.orders.filter(o=>o.status==='submitted').length ? ' ('+state.orders.filter(o=>o.status==='submitted').length+')' : ''}</button>
  </div>
  ${state.products.length===0 ? `<div class="empty" style="padding:30px;">No products yet. Add your first one below.</div>` :
  state.products.map(p=>`
    <div class="admin-row">
      <img src="${productImg(p)}">
      <div style="flex:1;">
        <div class="ar-name">${escapeHtml(p.name)}</div>
        <div class="ar-price">${fmt(p.price)} ETB</div>
      </div>
      <button class="icon-btn" onclick="editProduct('${p.id}')">✎</button>
      <button class="icon-btn" onclick="deleteProduct('${p.id}')">🗑</button>
    </div>`).join('')}
  <button class="add-fab" onclick="editProduct(null)">+ Add product</button>
  ${renderTabbar('admin-products')}`;
}
function deleteProduct(id){
  if (!confirm('Remove this product?')) return;
  state.products = state.products.filter(p=>p.id!==id);
  fsDeleteProduct(id);
  render();
}
function editProduct(id){
  state.editingProductId = id;
  state.pendingImageData = id ? (state.products.find(p=>p.id===id)||{}).image : null;
  go('admin-product-form');
}
function renderAdminProductForm(){
  const editing = state.editingProductId ? state.products.find(p=>p.id===state.editingProductId) : null;
  const img = state.pendingImageData;
  return `
  <div class="back-btn"><button onclick="go('admin-products')">&larr; Cancel</button></div>
  <div class="form-wrap">
    <h2 class="serif" style="margin:10px 0 18px;">${editing ? 'Edit product' : 'Add product'}</h2>
    <div class="field">
      <label>Photo</label>
      <div class="img-picker">
        <img src="${img || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22%23FBF0DA%22/></svg>'}">
        <button class="file-btn" onclick="document.getElementById('prodImgFile').click()">Choose image</button>
        <input type="file" id="prodImgFile" accept="image/*" style="display:none" onchange="onProductImageChosen(event)">
      </div>
    </div>
    <div class="field">
      <label>Product name</label>
      <input type="text" id="prodName" value="${editing ? escapeAttr(editing.name) : ''}" placeholder="e.g. Handwoven scarf">
    </div>
    <div class="field">
      <label>Price (ETB)</label>
      <input type="number" id="prodPrice" value="${editing ? editing.price : ''}" placeholder="e.g. 850">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="prodDesc" placeholder="A short, honest description of the product">${editing ? escapeHtml(editing.description||'') : ''}</textarea>
    </div>
  </div>
  <div class="fixed-bar">
    <button class="btn-primary" onclick="saveProduct()">${editing ? 'Save changes' : 'Add product'}</button>
  </div>`;
}
function onProductImageChosen(e){
  const file = e.target.files[0];
  if (!file) return;
  resizeImageFile(file, 700, (dataUrl)=>{ state.pendingImageData = dataUrl; render(); });
}
function saveProduct(){
  const name = document.getElementById('prodName').value.trim();
  const price = parseFloat(document.getElementById('prodPrice').value);
  const description = document.getElementById('prodDesc').value.trim();
  if (!name || !price || price<=0){ showToast('Add a name and a valid price'); return; }
  let p;
  if (state.editingProductId){
    p = state.products.find(x=>x.id===state.editingProductId);
    p.name = name; p.price = price; p.description = description;
    if (state.pendingImageData) p.image = state.pendingImageData;
  } else {
    p = { id: uid(), name, price, description, image: state.pendingImageData || null, createdAt: Date.now() };
    state.products.push(p);
  }
  fsSaveProduct(p);
  state.pendingImageData = null;
  showToast('Product saved');
  go('admin-products');
}

/* ============ ADMIN: ORDERS ============ */
function renderAdminOrders(){
  const sorted = [...state.orders].sort((a,b)=>{
    const rank = {submitted:0, pending_payment:1, confirmed:2, rejected:2};
    return (rank[a.status]-rank[b.status]) || (b.createdAt-a.createdAt);
  });
  return `
  <div class="section-title">Admin</div>
  <div class="admin-subnav">
    <button onclick="go('admin-products')">Products</button>
    <button class="active">Orders${sorted.filter(o=>o.status==='submitted').length ? ' ('+sorted.filter(o=>o.status==='submitted').length+')' : ''}</button>
  </div>
  ${sorted.length===0 ? `<div class="empty" style="padding:30px;">No orders yet.</div>` :
  sorted.map(o=>`
    <div class="order-card" onclick="viewAdminOrder('${o.id}')">
      <div class="oc-top">
        <div>
          <div class="oc-id">#${o.id} &middot; ${escapeHtml(o.userName)}${o.username ? ' (@'+escapeHtml(o.username)+')' : ''}</div>
          <div class="oc-total">${fmt(o.total)} ETB</div>
        </div>
        <span class="status-badge status-${o.status}">${statusLabel(o.status)}</span>
      </div>
      <div class="oc-items">${o.items.map(i=>i.name+' ×'+i.qty).join(', ')}</div>
    </div>`).join('')}
  ${renderTabbar('admin-orders')}`;
}
function viewAdminOrder(id){ state.viewingOrderId = id; go('admin-order-detail'); }
function renderAdminOrderDetail(){
  const o = state.orders.find(x=>x.id===state.viewingOrderId);
  if (!o){ go('admin-orders'); return ''; }
  return `
  <div class="back-btn"><button onclick="go('admin-orders')">&larr; All orders</button></div>
  <div class="pay-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0 12px;">
      <h2 class="serif" style="margin:0;">Order #${o.id}</h2>
      <span class="status-badge status-${o.status}">${statusLabel(o.status)}</span>
    </div>
    <div class="kv"><span>Customer</span><b>${escapeHtml(o.userName)}${o.username ? ' (@'+escapeHtml(o.username)+')' : ''}</b></div>
    <div class="kv"><span>Placed</span><b>${new Date(o.createdAt).toLocaleString()}</b></div>
    <div class="pay-summary" style="margin-top:14px;">
      ${o.items.map(i=>`<div class="row"><span>${escapeHtml(i.name)} &times; ${i.qty}</span><span>${fmt(i.price*i.qty)} ETB</span></div>`).join('')}
      <div class="row total"><span>Total</span><span>${fmt(o.total)} ETB</span></div>
    </div>
    ${o.note ? `<div class="note-box">"${escapeHtml(o.note)}"</div>` : ''}
    ${o.receipt ? `<img class="order-detail-receipt" src="${o.receipt}">` : `<div class="empty" style="padding:16px 0;">No receipt uploaded yet.</div>`}
  </div>
  ${o.status==='submitted' ? `
  <div class="fixed-bar">
    <button class="btn-danger" onclick="setOrderStatus('${o.id}','rejected')">Reject</button>
    <button class="btn-primary" onclick="setOrderStatus('${o.id}','confirmed')">Confirm payment</button>
  </div>` : ''}`;
}
function setOrderStatus(id, status){
  const o = state.orders.find(x=>x.id===id);
  if (!o) return;
  o.status = status;
  fsSaveOrder(o);
  showToast(status==='confirmed' ? 'Order confirmed' : 'Order rejected');
  go('admin-orders');
}

/* ============ UTIL ============ */
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ============ ROUTER ============ */
function render(){
  const app = document.getElementById('app');
  if (!state.loaded){ app.innerHTML = `<div class="empty" style="padding-top:120px;"><span class="serif">Loading…</span></div>`; return; }
  const map = {
    'catalog': renderCatalog, 'product': renderProduct, 'cart': renderCart,
    'pay': renderPay, 'upload': renderUpload, 'status': renderStatus,
    'myorders': renderMyOrders, 'order-view': renderOrderView,
    'admin-products': renderAdminProducts, 'admin-product-form': renderAdminProductForm,
    'admin-orders': renderAdminOrders, 'admin-order-detail': renderAdminOrderDetail,
  };
  const fn = map[state.screen] || renderCatalog;
  app.innerHTML = fn();
}

/* ============ BOOT ============ */
(function boot(){
  render(); // shows the loading state immediately
  setupRealtimeSync();
  upsertUserProfile();
})();
</script>
</body>
</html>
